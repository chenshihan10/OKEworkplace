<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>
    // 本地 API token：由桌面壳注入页面 URL，写请求自动携带同源 token
    (function () {
      var token = new URLSearchParams(window.location.search).get('token') || '';
      window.__OKE_TOKEN = token;
      if (!token) return;
      var nativeFetch = window.fetch.bind(window);
      window.fetch = function (input, init) {
        init = init || {};
        var headers = new Headers(init.headers || {});
        if (!headers.has('X-OKE-Token')) headers.set('X-OKE-Token', token);
        init.headers = headers;
        return nativeFetch(input, init);
      };
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>量化分析终端 - OKEworkplace</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      line-height: 1.5;
    }

    /* 轻提示：从顶部滑入，贴在页头下方（不遮挡版本/数据源那一行），5 秒后向上收起 */
    .app-toast {
      position: fixed;
      top: 76px;
      left: 50%;
      transform: translate(-50%, -120%);
      max-width: calc(100vw - 32px);
      box-sizing: border-box;
      padding: 10px 18px;
      background: rgba(30, 41, 59, 0.96);
      border: 1px solid #f59e0b;
      border-left: 3px solid #f59e0b;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 0.85rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.25s ease, opacity 0.25s ease;
      z-index: 999;
    }
    .app-toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* ===== 头部 ===== */
    header {
      background: linear-gradient(90deg, #1e293b 0%, #0f172a 100%);
      border-bottom: 1px solid #334155;
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .header-title {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(90deg, #3b82f6, #10b981);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .network-status {
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.25rem 0.75rem;
      border-radius: 4px;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid #334155;
    }

    .network-status.real {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.1);
    }

    .network-status.fallback {
      border-color: #f59e0b;
      background: rgba(245, 158, 11, 0.1);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.85rem;
    }

    .updated-time {
      padding: 0.25rem 0.75rem;
      background: rgba(59, 130, 246, 0.1);
      border-radius: 4px;
      border: 1px solid #3b82f6;
    }

    /* 更新时间与运行时长上下排列 */
    .header-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.25rem;
    }

    .uptime {
      font-size: 0.72rem;
      color: #94a3b8;
      font-family: Consolas, Monaco, monospace;
      user-select: text;
    }

    /* 当前网络出口（系统代理 / 本地端口探测 / 直连） */
    .proxy-exit {
      font-size: 0.72rem;
      color: #94a3b8;
      font-family: Consolas, Monaco, monospace;
      user-select: text;
    }

    .proxy-exit.is-direct {
      color: #f59e0b;
    }

    /* 版本角标：低调显示当前运行版本 */
    .app-version {
      font-size: 0.72rem;
      color: #64748b;
      font-family: Consolas, Monaco, monospace;
      user-select: text;
    }

    /* ===== 主容器 ===== */
    main {
      max-width: 1600px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    /* ===== 标签页 ===== */
    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid #334155;
    }

    .tab {
      padding: 0.75rem 1.5rem;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 500;
      border-bottom: 3px solid transparent;
      position: relative;
      bottom: -2px;
      transition: all 0.2s;
    }

    .tab.active {
      color: #3b82f6;
      border-bottom-color: #3b82f6;
    }

    .tab:hover {
      color: #cbd5e1;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* ===== 行情卡片网格 ===== */
    .market-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .market-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 1rem;
      transition: all 0.3s;
    }

    .market-card:hover {
      border-color: #3b82f6;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
      transform: translateY(-2px);
    }

    .market-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid #334155;
    }

    .symbol {
      font-size: 1.2rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    .alias {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-left: 0.5rem;
    }

    .source {
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      border-radius: 3px;
      font-weight: 600;
    }

    .source-real {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      border: 1px solid #10b981;
    }

    .source-fallback {
      background: rgba(245, 158, 11, 0.2);
      color: #f59e0b;
      border: 1px solid #f59e0b;
    }

    .market-price-row {
      margin-bottom: 1rem;
    }

    .price {
      font-size: 1.75rem;
      font-weight: 700;
      color: #3b82f6;
      margin-bottom: 0.5rem;
    }

    .market-meta {
      font-size: 0.85rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.25rem;
    }

    .market-meta div {
      display: flex;
      justify-content: space-between;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .metric-grid > div {
      background: rgba(30, 41, 59, 0.5);
      padding: 0.5rem;
      border-radius: 4px;
      border: 1px solid #334155;
    }

    .metric-grid label {
      display: block;
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 0.25rem;
    }

    .metric-grid strong {
      font-size: 0.95rem;
      color: #e2e8f0;
    }

    /* ===== 评分卡片 ===== */
    .scores-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .score-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 1rem;
    }

    .score-title {
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #3b82f6;
    }

    .score-main {
      font-size: 2.5rem;
      font-weight: 700;
      color: #10b981;
      margin-bottom: 1rem;
      text-align: center;
    }

    .score-components {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .component {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .component label {
      font-size: 0.75rem;
      color: #94a3b8;
      font-weight: 600;
    }

    .bar-container {
      height: 8px;
      background: #334155;
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-container .score-bar {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #10b981);
      transition: width 0.3s;
    }

    .component.risk .score-bar {
      background: linear-gradient(90deg, #ef4444, #f97316);
    }

    /* ===== 资金行为卡片 ===== */
    .behaviors-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .behavior-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 1rem;
    }

    .behavior-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid #334155;
    }

    .behavior-header strong {
      color: #3b82f6;
    }

    .confidence {
      font-size: 0.75rem;
      color: #10b981;
      font-weight: 600;
    }

    .behavior-type {
      font-weight: 700;
      color: #3b82f6;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }

    .behavior-signals {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .signal-tag {
      display: inline-block;
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid #3b82f6;
      color: #3b82f6;
      padding: 0.25rem 0.5rem;
      border-radius: 3px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .behavior-implications,
    .behavior-suggestion {
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
      line-height: 1.4;
    }

    .behavior-implications strong,
    .behavior-suggestion strong {
      color: #cbd5e1;
    }

    /* ===== 信号列表 ===== */
    .signals-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .signal-item {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #334155;
      border-left: 4px solid #94a3b8;
      border-radius: 6px;
      padding: 0.75rem;
    }

    .signal-item.buy {
      border-left-color: #10b981;
      background: rgba(16, 185, 129, 0.05);
    }

    .signal-item.sell {
      border-left-color: #ef4444;
      background: rgba(239, 68, 68, 0.05);
    }

    .signal-item.wait {
      border-left-color: #f59e0b;
      background: rgba(245, 158, 11, 0.05);
    }

    .signal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .recommendation {
      font-size: 0.85rem;
      padding: 0.25rem 0.5rem;
      background: rgba(59, 130, 246, 0.2);
      border-radius: 3px;
    }

    .signal-reason {
      font-size: 0.8rem;
      color: #cbd5e1;
      margin-bottom: 0.5rem;
      margin-left: 0.5rem;
    }

    .signal-reason div {
      margin: 0.25rem 0;
    }

    .signal-desc {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    /* ===== 订单流网格 ===== */
    .flow-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .flow-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 1rem;
    }

    .flow-head {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.75rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid #334155;
    }

    .flow-head strong {
      color: #3b82f6;
    }

    .positive {
      color: #10b981;
      font-weight: 600;
    }

    .negative {
      color: #ef4444;
      font-weight: 600;
    }

    .flow-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .flow-metrics > div {
      background: rgba(30, 41, 59, 0.5);
      padding: 0.5rem;
      border-radius: 4px;
      border: 1px solid #334155;
    }

    .flow-metrics label {
      display: block;
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 0.25rem;
    }

    .flow-metrics strong {
      display: block;
      font-size: 0.95rem;
      color: #e2e8f0;
    }

    .flow-ratio {
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .judgment {
      font-weight: 700;
      color: #3b82f6;
      text-align: right;
    }

    /* ===== 监控列表 ===== */
    .watchlist-table {
      width: 100%;
      border-collapse: collapse;
      background: #0f172a;
      border-radius: 8px;
      overflow: hidden;
    }

    .watchlist-table thead {
      background: #1e293b;
      border-bottom: 2px solid #334155;
    }

    .watchlist-table th {
      padding: 0.75rem;
      text-align: left;
      font-weight: 700;
      color: #94a3b8;
      font-size: 0.85rem;
    }

    .watchlist-table td {
      padding: 0.75rem;
      border-bottom: 1px solid #334155;
    }

    .watch-row {
      display: contents;
    }

    .watchlist-table tbody tr:hover {
      background: rgba(59, 130, 246, 0.1);
    }

    .watchlist-table tbody td:first-child {
      font-weight: 700;
      color: #3b82f6;
    }

    .watchlist-table .score {
      color: #fbbf24;
      font-weight: 700;
    }
    .watchlist-table .del-btn {
      background: none;
      border: 1px solid #ef4444;
      color: #ef4444;
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
    }
    .watchlist-table .del-btn:hover {
      background: #ef4444;
      color: #fff;
    }
    .add-coin-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 0.8rem;
      align-items: center;
    }

    /* ===== 空状态 ===== */
    .empty {
      text-align: center;
      padding: 2rem;
      color: #94a3b8;
      font-style: italic;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 768px) {
      .market-grid,
      .scores-grid,
      .behaviors-grid,
      .flow-grid {
        grid-template-columns: 1fr;
      }

      main {
        padding: 1rem;
      }

      .metric-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ===== 搜索下拉框 ===== */
    .coin-search-wrapper {
      position: relative;
      flex: 1;
    }
    .coin-search-wrapper input {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid #334155;
      border-radius: 4px;
      background: #1e293b;
      color: #e2e8f0;
      outline: none;
    }
    .coin-search-wrapper input:focus {
      border-color: #3b82f6;
    }
    .coin-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      max-height: 300px;
      overflow-y: auto;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0 0 4px 4px;
      z-index: 200;
      display: none;
    }
    .coin-dropdown.show {
      display: block;
    }
    .coin-dropdown-item {
      padding: 6px 10px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      border-bottom: 1px solid #334155;
    }
    .coin-dropdown-item:hover {
      background: #334155;
    }
    .coin-dropdown-item .sym {
      color: #e2e8f0;
    }
    .coin-dropdown-item .price {
      color: #94a3b8;
      font-size: 0.8rem;
    }
    .coin-dropdown-item .vol {
      color: #64748b;
      font-size: 0.75rem;
    }
    .coin-dropdown-item.selected {
      background: #2563eb;
    }
    .coin-dropdown-item.selected .sym {
      color: #fff;
    }
    .coin-dropdown-empty {
      padding: 12px;
      text-align: center;
      color: #64748b;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <!-- 顶部轻提示（代理/行情不可用，自动消失） -->
  <div id="app-toast" class="app-toast" role="status" aria-live="polite"></div>

  <!-- 头部 -->
  <header>
    <div class="header-left">
      <div class="header-title">⚡ 量化分析终端</div>
      <div class="network-status" data-network-status title="">🟡 检查连接...</div>
      <span class="app-version" data-app-version title="当前运行版本">v--</span>
    </div>
    <div class="header-right">
      <div class="header-meta">
        <div class="updated-time">更新: <span data-updated-at>--</span></div>
        <div class="uptime">运行: <span data-uptime>--</span></div>
        <div class="proxy-exit">出口: <span data-proxy-exit>--</span></div>
      </div>
    </div>
  </header>

  <!-- 主要内容 -->
  <main>
    <!-- 标签页导航 -->
    <div class="tabs">
      <button class="tab active" data-tab="overview">概览</button>
      <button class="tab" data-tab="scores">评分分析</button>
      <button class="tab" data-tab="signals">交易信号</button>
      <button class="tab" data-tab="mtf">多周期</button>
      <button class="tab" data-tab="flow">订单流</button>
      <button class="tab" data-tab="orderflow">订单</button>
      <button class="tab" data-tab="account" id="tab-btn-account" style="display:none;">实盘</button>
      <button class="tab" data-tab="performance">绩效</button>
      <button class="tab" data-tab="research">研究</button>
      <button class="tab" data-tab="watchlist">币种列表</button>
    </div>

    <!-- 概览 -->
    <div id="tab-overview" class="tab-content active">
      <div class="market-grid" data-market-grid></div>
    </div>

    <!-- 评分分析 -->
    <div id="tab-scores" class="tab-content">
      <div class="scores-grid" data-market-scores></div>
    </div>

    <!-- 交易信号 -->
    <div id="tab-signals" class="tab-content">
      <div style="margin-bottom: 1rem; color: #94a3b8; font-size: 0.9rem;">
        找到 <span data-signal-count>0</span> 个交易机会
      </div>
      <div class="signals-list" data-signals></div>
    </div>

    <!-- 多周期 -->
    <div id="tab-mtf" class="tab-content">
      <div class="mtf-grid" data-mtf-grid></div>
    </div>

    <!-- 订单流 -->
    <div id="tab-flow" class="tab-content">
      <div class="flow-grid" data-flow-grid></div>
    </div>

    <!-- 订单 -->
    <div id="tab-orderflow" class="tab-content">
      <div class="orders-grid" data-orders-grid></div>
    </div>

    <!-- 实盘（只读） -->
    <div id="tab-account" class="tab-content">
      <div data-account></div>
    </div>

    <!-- 预测绩效 -->
    <div id="tab-performance" class="tab-content">
      <div data-performance></div>
    </div>

    <!-- 研究：绩效质量、成本门槛、品种分类、影子评分与运行监控（只读） -->
    <div id="tab-research" class="tab-content">
      <div data-research-panel style="color:#94a3b8;">加载中…</div>
    </div>

    <!-- 币种列表 -->
    <div id="tab-watchlist" class="tab-content">
      <div style="margin-bottom: 1rem; color: #94a3b8; font-size: 0.9rem;">
        已添加 <span data-watch-count>0</span> 个币种
      </div>

      <!-- 添加币种表单（可搜索下拉） -->
      <div class="add-coin-bar">
        <div class="coin-search-wrapper">
          <input type="text" id="new-coin-search" placeholder="搜索币种..." autocomplete="off" oninput="filterAvailableCoins(this.value)" onfocus="loadAvailableCoins()">
          <div id="coin-dropdown" class="coin-dropdown"></div>
        </div>
        <button onclick="addCoinFromSearch()" style="padding:6px 16px; background:#2563eb; color:#fff; border:none; border-radius:4px; cursor:pointer;">添加</button>
      </div>

      <table class="watchlist-table">
        <thead>
          <tr>
            <th>币种</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody data-watchlist></tbody>
      </table>
    </div>
  </main>

  <!-- 开单模态框 -->
  <div id="order-modal" class="modal-overlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:1000;justify-content:center;align-items:center;">
    <div class="modal-content" style="background:#1e293b;border:1px solid #334155;border-radius:12px;padding:24px;width:360px;max-width:90vw;">
      <h3 style="margin:0 0 16px;color:#f1f5f9;">📝 开单</h3>
      <div class="modal-field" style="margin-bottom:12px;">
        <label style="display:block;color:#94a3b8;font-size:0.85rem;margin-bottom:4px;">币种</label>
        <input id="modal-symbol" type="text" readonly style="width:100%;padding:8px 12px;background:#0f172a;border:1px solid #334155;border-radius:6px;color:#e2e8f0;font-size:0.9rem;">
      </div>
      <div class="modal-field" style="margin-bottom:12px;">
        <label style="display:block;color:#94a3b8;font-size:0.85rem;margin-bottom:4px;">方向</label>
        <div style="display:flex;gap:8px;">
          <button id="modal-direction-long" class="dir-btn active" style="flex:1;padding:8px;background:#22c55e;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:bold;">多头 LONG</button>
          <button id="modal-direction-short" class="dir-btn" style="flex:1;padding:8px;background:#334155;color:#94a3b8;border:none;border-radius:6px;cursor:pointer;">空头 SHORT</button>
        </div>
      </div>
      <div class="modal-field" style="margin-bottom:12px;">
        <label style="display:block;color:#94a3b8;font-size:0.85rem;margin-bottom:4px;">价格</label>
        <input id="modal-price" type="number" step="0.001" style="width:100%;padding:8px 12px;background:#0f172a;border:1px solid #334155;border-radius:6px;color:#e2e8f0;font-size:0.9rem;">
      </div>
      <div class="modal-field" style="margin-bottom:12px;">
        <label style="display:block;color:#94a3b8;font-size:0.85rem;margin-bottom:4px;">数量（选填）</label>
        <input id="modal-quantity" type="number" step="0.001" style="width:100%;padding:8px 12px;background:#0f172a;border:1px solid #334155;border-radius:6px;color:#e2e8f0;font-size:0.9rem;">
        <div id="modal-suggested" style="margin-top:4px;font-size:0.75rem;color:#64748b;">建议数量：配置权益与止损后显示</div>
      </div>
      <div class="modal-field" style="margin-bottom:12px;display:flex;gap:8px;">
        <div style="flex:1;">
          <label style="display:block;color:#94a3b8;font-size:0.85rem;margin-bottom:4px;">止损价（选填）</label>
          <input id="modal-stop-loss" type="number" step="0.001" style="width:100%;padding:8px 12px;background:#0f172a;border:1px solid #334155;border-radius:6px;color:#e2e8f0;font-size:0.9rem;">
        </div>
        <div style="flex:1;">
          <label style="display:block;color:#94a3b8;font-size:0.85rem;margin-bottom:4px;">止盈价（选填）</label>
          <input id="modal-take-profit" type="number" step="0.001" style="width:100%;padding:8px 12px;background:#0f172a;border:1px solid #334155;border-radius:6px;color:#e2e8f0;font-size:0.9rem;">
        </div>
      </div>
      <div class="modal-field" style="margin-bottom:16px;">
        <label style="display:block;color:#94a3b8;font-size:0.85rem;margin-bottom:4px;">备注（选填）</label>
        <input id="modal-note" type="text" maxlength="200" style="width:100%;padding:8px 12px;background:#0f172a;border:1px solid #334155;border-radius:6px;color:#e2e8f0;font-size:0.9rem;">
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button onclick="closeOrderModal()" style="padding:8px 20px;background:#334155;color:#94a3b8;border:none;border-radius:6px;cursor:pointer;">取消</button>
        <button id="modal-confirm" style="padding:8px 20px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:bold;">✓ 确认开单</button>
      </div>
    </div>
  </div>

  <!-- 风险设置模态框 -->
  <div id="risk-modal" class="modal-overlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:1000;justify-content:center;align-items:center;">
    <div class="modal-content" style="background:#1e293b;border:1px solid #334155;border-radius:12px;padding:24px;width:360px;max-width:90vw;">
      <h3 style="margin:0 0 16px;color:#f1f5f9;">🛡 风险设置</h3>
      <div class="modal-field" style="margin-bottom:12px;">
        <label style="display:block;color:#94a3b8;font-size:0.85rem;margin-bottom:4px;">账户权益（USDT，留空表示未配置）</label>
        <input id="risk-equity" type="number" step="0.01" style="width:100%;padding:8px 12px;background:#0f172a;border:1px solid #334155;border-radius:6px;color:#e2e8f0;font-size:0.9rem;">
      </div>
      <div class="modal-field" style="margin-bottom:12px;display:flex;gap:8px;">
        <div style="flex:1;">
          <label style="display:block;color:#94a3b8;font-size:0.85rem;margin-bottom:4px;">单笔风险 %</label>
          <input id="risk-per-trade" type="number" step="0.1" style="width:100%;padding:8px 12px;background:#0f172a;border:1px solid #334155;border-radius:6px;color:#e2e8f0;font-size:0.9rem;">
        </div>
        <div style="flex:1;">
          <label style="display:block;color:#94a3b8;font-size:0.85rem;margin-bottom:4px;">组合风险 %</label>
          <input id="risk-portfolio" type="number" step="0.1" style="width:100%;padding:8px 12px;background:#0f172a;border:1px solid #334155;border-radius:6px;color:#e2e8f0;font-size:0.9rem;">
        </div>
      </div>
      <div class="modal-field" style="margin-bottom:16px;">
        <label style="display:block;color:#94a3b8;font-size:0.85rem;margin-bottom:4px;">单币集中度 %</label>
        <input id="risk-concentration" type="number" step="0.1" style="width:100%;padding:8px 12px;background:#0f172a;border:1px solid #334155;border-radius:6px;color:#e2e8f0;font-size:0.9rem;">
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button onclick="closeRiskModal()" style="padding:8px 20px;background:#334155;color:#94a3b8;border:none;border-radius:6px;cursor:pointer;">取消</button>
        <button id="risk-confirm" style="padding:8px 20px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:bold;">保存</button>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
